name: Bump agent installer fallback tags

# Keeps the `agent` installer's built-in fallback tags alive against
# LenderCom/saw-agent-releases. The installer resolves the live release from that repo's
# Atom feed, so these constants only serve installs that cannot reach the feed — but the
# dev channel prunes old prereleases, so a fallback left to rot 404s instead of merely
# installing something old. Nothing dispatches this repo on publish yet (same unwired-sender
# gap as homebrew-tap's bump-formula*.yml), so this polls on a schedule; workflow_dispatch
# covers a manual bump and a future repository_dispatch can be added once the sending side
# exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dev release tag on LenderCom/saw-agent-releases, e.g. dev-v0.2.0-dev.5 (default: latest pre-release)"
        required: false
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: bump-agent-dev-tag
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dev_tag="${{ inputs.tag }}"
          if [ -z "$dev_tag" ]; then
            dev_tag=$(gh release list --repo LenderCom/saw-agent-releases \
              --json tagName,isPrerelease,isDraft \
              --jq '[.[] | select(.isPrerelease and (.isDraft | not))][0].tagName // empty')
          fi
          if [ -z "$dev_tag" ]; then
            echo "no dev pre-release tag found on LenderCom/saw-agent-releases (and none given)" >&2
            exit 1
          fi
          stable_tag=$(gh release list --repo LenderCom/saw-agent-releases \
            --json tagName,isPrerelease,isDraft \
            --jq '[.[] | select((.isPrerelease | not) and (.isDraft | not))][0].tagName // empty')
          if [ -z "$stable_tag" ]; then
            echo "no stable release tag found on LenderCom/saw-agent-releases" >&2
            exit 1
          fi
          echo "dev=$dev_tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable_tag" >> "$GITHUB_OUTPUT"

      - name: Bump fallback tags
        run: |
          script/bump-fallback-tag.sh dev "${{ steps.tag.outputs.dev }}"
          script/bump-fallback-tag.sh stable "${{ steps.tag.outputs.stable }}"

      - name: Verify
        run: |
          sh -n agent
          command -v shellcheck >/dev/null 2>&1 && shellcheck -s sh agent || true

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump agent installer fallback tags (dev ${{ steps.tag.outputs.dev }}, stable ${{ steps.tag.outputs.stable }})"
          # Fixed branch: dev cuts several releases a day, so each poll updates the SAME
          # open PR in place instead of piling up one PR per build (mirrors
          # homebrew-tap's bump-formula-dev.yml).
          branch: bump-agent-dev-tag
          title: "chore: bump agent installer fallback tags (dev ${{ steps.tag.outputs.dev }}, stable ${{ steps.tag.outputs.stable }})"
          body: |
            Automated bump of the `agent` installer's built-in fallback tags to
            `LenderCom/saw-agent-releases@${{ steps.tag.outputs.dev }}` (dev) and
            `@${{ steps.tag.outputs.stable }}` (stable). Nothing else changed.

            These constants are the offline fallback only — the installer resolves the live
            release from the releases Atom feed at install time — but they must stay pointed
            at a release that still EXISTS, because the dev channel prunes old prereleases.

            This PR is force-updated in place on every new dev-channel build until merged.
